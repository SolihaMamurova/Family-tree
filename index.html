<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oilaviy Shajara — Xotiralar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{--bg:#f1e3c8;--paper:#fff7e6;--panel:rgba(255,247,230,.62);--ink:#4a3222;--mute:#8b6b4f;--line:#8b5e3c;--gold:#a8672a;--trunk:#7a4f2c;--leaf:#5f8f4a;--shadow:0 2px 8px rgba(74,50,34,.22);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1c12;--paper:#3a2819;--panel:rgba(58,40,25,.72);--ink:#f3e3c7;--mute:#c4a27c;--line:#b98a5e;--gold:#e0a35a;--trunk:#8a5a34;--leaf:#3f6b3a;--shadow:0 2px 10px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2a1c12;--paper:#3a2819;--panel:rgba(58,40,25,.72);--ink:#f3e3c7;--mute:#c4a27c;--line:#b98a5e;--gold:#e0a35a;--trunk:#8a5a34;--leaf:#3f6b3a;--shadow:0 2px 10px rgba(0,0,0,.5);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:radial-gradient(circle at 50% 0,var(--paper),var(--bg) 75%) fixed var(--bg)}
body{color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;font-size:18px;min-height:100vh}
.bgtree{position:fixed;inset:0;width:100%;height:100%;z-index:-1;opacity:.38;pointer-events:none}
.disp{font-family:'Playfair Display',Georgia,serif}
.orn{display:flex;align-items:center;gap:12px;justify-content:center;color:var(--gold)}
.orn::before,.orn::after{content:"";height:1px;width:60px;background:var(--line)}
.panel{background:var(--panel);box-shadow:var(--shadow);border:1px solid rgba(139,94,60,.25)}
.m{--c:#6aa59f}.f{--c:#d4695c}
.tree-scroll{overflow-x:auto;padding:8px 12px 24px}
.tree{width:max-content;min-width:100%}
.tree ul{display:flex;justify-content:center;padding-top:28px;position:relative}
.tree>ul{padding-top:0}
.tree li{list-style:none;text-align:center;position:relative;padding:28px 6px 0}
.tree>ul>li{padding-top:0}
.tree li::before,.tree li::after{content:"";position:absolute;top:0;right:50%;border-top:3px solid var(--line);width:50%;height:28px}
.tree li::after{right:auto;left:50%;border-left:3px solid var(--line)}
.tree>ul>li::before,.tree>ul>li::after{display:none}
.tree li:only-child::before,.tree li:only-child::after{display:none}
.tree li:only-child{padding-top:28px}
.tree li:first-child::before,.tree li:last-child::after{border:0 none}
.tree li:last-child::before{border-right:3px solid var(--line);border-radius:0 10px 0 0}
.tree li:first-child::after{border-radius:10px 0 0 0}
.tree ul ul::before{content:"";position:absolute;top:0;left:50%;border-left:3px solid var(--line);height:28px}
.couple{display:inline-flex;align-items:center}
.ring{color:var(--gold);font-size:16px;margin:0 5px}
.card{width:112px;padding:10px 6px 8px;border:2px solid;border-radius:14px;box-shadow:var(--shadow);transition:.2s;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;color:#4a3222;cursor:pointer}
.card.m{background:#d9f3f4;border-color:#9cccca}
.card.f{background:#fad6d0;border-color:#e3a197}
.card:hover,.card:focus-visible{transform:translateY(-3px);box-shadow:0 8px 18px rgba(74,50,34,.35);outline:none}
.card svg,.ibox svg{fill:var(--c)}
.card b{font-size:16px;line-height:1.1;font-weight:700;overflow-wrap:anywhere}
.card i{font-size:13px;color:#8b6b4f;font-style:normal}
.dead{filter:grayscale(.55);opacity:.92}
.me{border-color:var(--gold);box-shadow:0 0 0 4px rgba(168,103,42,.3),var(--shadow)}
.badge{position:absolute;top:-9px;right:-6px;background:var(--gold);color:#fff;font-size:11px;border-radius:9px;padding:0 7px}
.mbox{background:var(--paper);border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.4);animation:pop .2s ease}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.ibox{width:88px;height:88px;border-radius:20px;display:grid;place-items:center;margin:auto}
.ibox.m{background:#d9f3f4}.ibox.f{background:#fad6d0}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px dashed var(--line);font-size:17px}
.row span:first-child{color:var(--mute)}
.row span:last-child{text-align:right;font-weight:700}
.zb{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;background:var(--paper);font-size:22px;color:var(--ink)}
.forest{position:relative;width:max-content;min-width:100%;padding:0 20px}
.roots{display:flex;gap:56px;align-items:flex-start;width:max-content}
.sec{width:max-content}.sec .tree{min-width:0}
.main{width:max-content;margin-top:110px}
.links{position:absolute;left:0;top:0;pointer-events:none;z-index:2}
.links path{fill:none;stroke:var(--gold);stroke-width:3.5;stroke-dasharray:8 6;stroke-linecap:round}

.links circle{fill:var(--gold)}
.memories{max-width:1120px;margin:30px auto;padding:26px 20px;border-radius:26px}
.memory-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px;margin-top:22px}
.memory-card{overflow:hidden;border-radius:17px;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow)}
.memory-card img{width:100%;height:180px;object-fit:cover;display:block}
.memory-caption{padding:11px 12px;font-size:17px;overflow-wrap:anywhere}
.memory-actions{display:flex;justify-content:space-between;align-items:center;padding:0 12px 12px;gap:8px}
.memory-actions button,.memory-upload{border-radius:999px;padding:8px 14px;background:var(--gold);color:white}
.memory-empty{padding:30px 14px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--mute)}
.memory-input{display:block;width:100%;max-width:420px;margin:12px auto;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink)}

</style>
</head>
<body>
<svg class="bgtree" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
<defs>
 <radialGradient id="canopy"><stop stop-color="#8eaa63"/><stop offset="1" stop-color="#456b3d"/></radialGradient>
 <linearGradient id="bark" x1="0" x2="1"><stop stop-color="#4d3020"/><stop offset=".45" stop-color="#93613a"/><stop offset="1" stop-color="#543522"/></linearGradient>
</defs>
<g fill="url(#canopy)" opacity=".92">
 <ellipse cx="400" cy="260" rx="215" ry="170"/><ellipse cx="230" cy="335" rx="155" ry="132"/>
 <ellipse cx="580" cy="330" rx="165" ry="140"/><ellipse cx="310" cy="175" rx="132" ry="112"/>
 <ellipse cx="505" cy="170" rx="145" ry="118"/><ellipse cx="105" cy="430" rx="105" ry="92"/>
 <ellipse cx="700" cy="430" rx="110" ry="95"/><ellipse cx="400" cy="105" rx="105" ry="100"/>
</g>
<g fill="#b3c47a" opacity=".35">
 <circle cx="270" cy="250" r="22"/><circle cx="355" cy="145" r="18"/><circle cx="480" cy="260" r="25"/>
 <circle cx="600" cy="350" r="20"/><circle cx="170" cy="365" r="18"/><circle cx="420" cy="330" r="17"/>
 <circle cx="530" cy="115" r="16"/><circle cx="340" cy="390" r="19"/><circle cx="670" cy="410" r="17"/>
</g>
<g fill="none" stroke="url(#bark)" stroke-linecap="round" stroke-linejoin="round">
 <path d="M395 1030 C405 870 385 740 405 600 C420 470 395 360 405 230" stroke-width="78"/>
 <path d="M402 720 C330 650 285 565 205 485 C170 450 145 420 125 370" stroke-width="30"/>
 <path d="M405 680 C485 625 535 545 620 475 C655 445 675 405 690 360" stroke-width="31"/>
 <path d="M402 580 C350 490 330 405 300 310 C285 260 280 225 285 190" stroke-width="21"/>
 <path d="M405 535 C465 445 490 360 520 270 C540 220 565 190 590 165" stroke-width="22"/>
 <path d="M300 580 C260 525 235 475 225 410" stroke-width="14"/>
 <path d="M520 565 C565 520 590 470 605 420" stroke-width="14"/>
 <path d="M390 760 C355 700 330 665 290 640" stroke-width="12"/>
</g>
<g fill="none" stroke="#bd8a5a" stroke-width="3" opacity=".5" stroke-linecap="round">
 <path d="M395 1000 C410 850 390 735 414 600"/><path d="M430 680 C490 620 545 550 620 490"/>
 <path d="M375 690 C330 640 280 580 220 520"/><path d="M410 520 C400 430 405 345 415 265"/>
</g>
</svg>
<header class="text-center pt-10 pb-4 px-4">
  <p class="orn text-xs uppercase tracking-[.3em]">Oilaviy meros</p>
  <h1 class="disp text-4xl md:text-5xl mt-2 font-bold">Oilaviy Shajara</h1>
  <p class="mt-2" style="color:var(--mute)">Ajdodlardan avlodlarga — kartochkaga bosing</p>
  <div class="flex items-center justify-center gap-3 mt-4">
    <button class="zb" id="zo" aria-label="Kichraytirish">−</button>
    <span class="text-sm" style="color:var(--mute)">† hayot emas · oltin punktir — oilalar qoʻshilishi</span>
    <button class="zb" id="zi" aria-label="Kattalashtirish">+</button>
  </div>
  <button id="bd" class="mt-4 rounded-full px-5 py-2 text-base" style="background:var(--gold);color:#fff">🎂 Tugʻilgan kunlarni kalendarga qoʻshish</button>
</header>
<main id="app" class="pb-16"></main>

<section class="memories panel mx-3" aria-labelledby="memory-title">
 <div class="text-center">
  <p class="orn text-xs uppercase tracking-[.25em]">Oilaviy suratlar</p>
  <h2 id="memory-title" class="disp text-3xl font-bold mt-2">📷 Xotiralar</h2>
  <p class="mt-2" style="color:var(--mute)">Aziz insonlar va unutilmas lahzalarni shu yerda saqlang.</p>
 </div>
 <div class="mt-5 text-center">
  <label for="memoryFiles" class="memory-upload inline-block cursor-pointer">＋ Rasmlarni joylash</label>
  <input id="memoryFiles" class="memory-input" type="file" accept="image/*" multiple>
  <input id="memoryCaption" class="memory-input" type="text" maxlength="100" placeholder="Rasmlar uchun izoh (ixtiyoriy)">
  <p class="text-xs mt-2" style="color:var(--mute)">Rasmlar shu qurilma va brauzerda saqlanadi.</p>
 </div>
 <div id="memoryGrid" class="memory-grid"></div>
</section>

<div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4" style="background:rgba(40,28,14,.55)">
  <div class="mbox w-full max-w-sm rounded-2xl p-6 relative" role="dialog" aria-modal="true">
    <button id="x" class="absolute top-2 right-4 text-3xl" aria-label="Yopish">×</button>
    <div id="mc"></div>
  </div>
</div>

<script>
/* ====== MA’LUMOTLAR ======
   A(id, ism, jins('m'/'f'), tugʻilgan yil, oy, kun, vafot(1/0), "menga kim boʻladi")
   Oy/kun yoʻq boʻlsa 0 yozing. Yil nomaʼlum boʻlsa null yozing. */
const P={};
const A=(id,n,g,by,bm,bd,dead,rel)=>P[id]={id,n,g,by,bm,bd,dead,rel};
// --- Mamurjon tomoni
A('abdurasul','Abdurasul','m',1920,0,0,1,'Katta opoqijonim (opoqijonimning otasi)');
A('gulsinoy','Gulsinoy','f',1922,0,0,1,'Katta buvijonim (opoqijonimning onasi)');
A('abduxoliq','Abduxoliq','m',1951,0,0,1,'Opoqijonimning akasi');
A('maxfirat','Maxfiratxon','f',1954,0,0,1,'Opoqijonimning opasi');
A('raxmonjon','Raxmonjon','m',1958,0,0,0,'Opoqijonimning akasi');
A('mamurjon','Mamurjon','m',1961,7,11,0,'Opoqijonim (dadamning otasi)');
// --- Soraxon tomoni
A('nishonboy','Nishonboy','m',1896,0,0,1,'Buvijonimning bobosi (katta buvijonimning otasi)');
A('ergashoy','Ergashoy','f',1920,0,0,1,'Buvijonimning buvisi (katta buvijonimning onasi)');
A('xidoyat','Xidoyatxon','f',1935,0,0,1,'Buvijonimning xolasi (katta buvijonimning opasi)');
A('inobat','Inobatxon','f',1937,0,0,1,'Buvijonimning xolasi (katta buvijonimning opasi)');
A('ogiloy','Oʻgʻiloy','f',1939,0,0,0,'Katta buvijonim (buvijonimning onasi)');
A('esonjon','Esonjon','m',1935,0,0,1,'Katta opoqijonim (buvijonimning otasi)');
A('mamaroziq','Mamaroziq','m',1941,0,0,0,'Buvijonimning togʻasi (katta buvijonimning ukasi)');
A('anorxon','Anorxon','f',1953,0,0,0,'Buvijonimning xolasi (katta buvijonimning singlisi)');
A('abdusalim','Abdusalim','m',1957,0,0,0,'Buvijonimning togʻasi (katta buvijonimning ukasi)');
A('abdurahim','Abdurahim','m',1959,0,0,0,'Buvijonimning togʻasi (katta buvijonimning ukasi)');
A('ominaxon','Ominaxon','f',1964,0,0,0,'Buvijonimning xolasi (katta buvijonimning singlisi)');
A('bahodir','Bahodir','m',1957,0,0,1,'Buvijonimning akasi');
A('motabar','Moʻtabar','f',1960,0,0,1,'Buvijonimning opasi');
A('soraxon','Soraxon','f',1963,9,10,0,'Buvijonim (dadamning onasi)');
A('bahtiyor','Bahtiyor','m',1966,0,0,0,'Buvijonimning ukasi');
A('muqimjon','Muqimjon','m',1968,4,28,0,'Buvijonimning ukasi');
A('zuhriddin','Zuhriddin','m',1970,0,0,0,'Buvijonimning ukasi');
A('zubayda','Zubayda','f',1973,0,0,0,'Buvijonimning singlisi');
A('hadiya','Hadiyaxon','f',1975,0,0,0,'Buvijonimning singlisi');
// --- Muslimaxon (oyim) tomoni
A('akbar','Akbarjon','m',1905,0,0,1,'Katta opoqijonim (oyimning bobosi)');
A('umrinsa','Umrinsa','f',1910,0,0,1,'Katta buvijonim (oyimning buvisi)');
A('mamur2','Mamurjon','m',1940,0,0,1,'Opoqijonimning akasi');
A('hamdam','Hamdamali','m',1943,0,0,1,'Opoqijonimning akasi');
A('axmad','Axmadali','m',1945,0,0,0,'Opoqijonimning akasi');
A('nurinso','Nurinso','f',1947,0,0,1,'Opoqijonimning opasi');
A('qumrinso','Qumrinso','f',1949,0,0,1,'Opoqijonimning opasi');
A('rozixon','Roʻzixon','f',1951,0,0,0,'Opoqijonimning opasi');
A('nurm1','Nurmuhammad','m',1953,1,5,0,'Opoqijonim (oyimning otasi)');
A('lobarxon','Lobarxon','f',1955,1,20,0,'Buvijonim (oyimning onasi)');
A('nomonjon','Noʻmonjon','m',1976,2,20,0,'Togʻam (oyimning akasi)');
A('sabohat','Sabohatxon','f',1978,2,21,0,'Xolam (oyimning opasi)');
A('nozimjon','Nozimjon','m',1980,11,18,0,'Togʻam (oyimning akasi)');
A('muhtasar','Muhtasarxon','f',1983,7,25,0,'Xolam (oyimning opasi)');
A('muslima','Muslimaxon','f',1986,9,2,0,'Oyim');
// --- Asosiy avlod
A('sherali','Sherali','m',1984,4,15,0,'Dadam');
A('saydali','Saydali','m',1987,2,27,0,'Amakim (otamning ukasi)');
A('feruza','Feruzaxon','f',1992,11,3,0,'Yengam (amakimning rafiqasi)');
A('sevara','Sevara','f',1989,3,22,0,'Ammajonim (otamning singlisi)');
A('nodir','Nodirjon','m',1985,4,6,0,'Ammajonimning eri');
A('sayyora','Sayyora','f',1991,9,29,0,'Ammajonim (otamning singlisi)');
A('muhsin','Muhsinjon','m',1990,0,0,0,'Ammajonimning eri');
A('soliha','Soliha','f',2009,7,1,0,'Bu — siz!');
A('sabina','Sabina','f',2011,4,8,0,'Singlim');
A('suhrobbek','Suhrobbek','m',2013,4,1,0,'Ukam');
A('sadiya','Sadiyaxon','f',2025,8,11,0,'Singlim');
const am='Amakivachcham (amakimning farzandi)', amm='Ammavachcham (ammajonimning farzandi)';
A('mohinur','Mohinur','f',2016,6,4,0,am);
A('saidnur','Saidnur','m',2019,4,27,0,am);
A('muhammadiso','Muhammadiso','m',2024,2,22,0,am);
A('temurmalik','Temurmalik','m',2013,2,14,0,amm);
A('yoqut','Yoqutxon','f',2015,1,27,0,amm);
A('bilol','Muhammadbilol','m',2025,5,2,0,amm);
A('yusuf','Muhammadyusuf','m',2015,9,9,0,amm);
A('nurm2','Nurmuhammad','m',2018,10,22,0,amm);
A('amirshoh','Amirshoh','m',2023,3,14,0,amm);

/* ====== DARAXT TUZILISHI ====== (L = yakka shaxs, U = juftlik + farzandlar) */
const L=id=>({c:[id]}), U=(a,b,k)=>({c:[a,b],k});
const SECTIONS=[
 {t:'Abdurasul va Gulsinoy avlodlari',
  n:U('abdurasul','gulsinoy',[L('abduxoliq'),L('maxfirat'),L('raxmonjon'),L('mamurjon')])},
 {t:'Nishonboy va Ergashoy avlodlari',
  n:U('nishonboy','ergashoy',[L('xidoyat'),L('inobat'),
    U('ogiloy','esonjon',[L('bahodir'),L('motabar'),L('soraxon'),L('bahtiyor'),L('muqimjon'),L('zuhriddin'),L('zubayda'),L('hadiya')]),
    L('mamaroziq'),L('anorxon'),L('abdusalim'),L('abdurahim'),L('ominaxon')])},
 {t:'Akbarjon va Umrinsa avlodlari',
  n:U('akbar','umrinsa',[L('mamur2'),L('hamdam'),L('axmad'),L('nurinso'),L('qumrinso'),L('rozixon'),
    U('nurm1','lobarxon',[L('nomonjon'),L('sabohat'),L('nozimjon'),L('muhtasar'),L('muslima')])])},
 {t:'Mamurjon va Soraxon avlodlari',
  n:U('mamurjon','soraxon',[
    U('sherali','muslima',[L('soliha'),L('sabina'),L('suhrobbek'),L('sadiya')]),
    U('saydali','feruza',[L('mohinur'),L('saidnur'),L('muhammadiso')]),
    U('sevara','nodir',[L('temurmalik'),L('yoqut'),L('bilol')]),
    U('sayyora','muhsin',[L('yusuf'),L('nurm2'),L('amirshoh')])])}
];
const LINK={mamurjon:1,soraxon:1,muslima:1};

/* Ota-ona, juft, farzandlarni avtomatik aniqlash */
function walk(n){
  if(n.c[1]){P[n.c[0]].sp=n.c[1];P[n.c[1]].sp=n.c[0]}
  if(n.k){const kn=n.k.map(x=>P[x.c[0]].n);n.c.forEach(i=>P[i].kids=kn);
    n.k.forEach(x=>{P[x.c[0]].par=n.c;walk(x)})}
}
SECTIONS.forEach(s=>walk(s.n));

const ICO=(g,s=46)=>`<svg viewBox="0 0 64 64" width="${s}" height="${s}"><path d="M6 64c1-17 11-24 26-24s25 7 26 24z"/>${g==='f'?'<path d="M17 27c0-13 6-20 15-20s15 7 15 20v11c-2 2-4 3-6 3V26c-4-1-8-4-9-9-2 5-6 8-9 9v15c-2 0-4-1-6-3z"/><circle cx="32" cy="26" r="9"/>':'<circle cx="32" cy="24" r="12"/>'}</svg>`;
const card=(id,leaf)=>{const p=P[id];
  return `<button class="card ${p.g} ${p.dead?'dead':''} ${id==='soliha'?'me':''}" data-id="${id}">
  ${leaf&&LINK[id]?'<span class="badge">↓</span>':''}${ICO(p.g)}<b>${p.n}</b>
  <i>${p.by||'19__'}${p.dead?' †':''}</i></button>`};
const node=n=>`<li><div class="couple">${n.c.map((id,i)=>(i?'<span class="ring">♥</span>':'')+card(id,n.c.length===1)).join('')}</div>${n.k?`<ul>${n.k.map(node).join('')}</ul>`:''}</li>`;

const secHTML=x=>`<div class="sec"><h2 class="disp text-xl font-bold mb-3 px-2 text-center">${x.t}</h2><div class="tree"><ul>${node(x.n)}</ul></div></div>`;
document.getElementById('app').innerHTML=`<div class="mx-2 my-8 rounded-3xl panel py-6"><div class="tree-scroll"><div class="forest" id="forest">
 <svg class="links" id="links"></svg>
 <div class="roots">${[2,0,1].map(i=>secHTML(SECTIONS[i])).join('')}</div>
 <div class="main" id="main">${secHTML(SECTIONS[3])}</div></div></div></div>`;

/* Modal */
const OY=['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentyabr','oktyabr','noyabr','dekabr'];
const now=new Date();
function ageText(p){
  if(p.dead)return 'Vafot etgan';
  if(!p.by)return '—';
  const Y=now.getFullYear(),M=now.getMonth()+1,D=now.getDate();
  if(!p.bm)return `~${Y-p.by} yosh`;
  const tm=(Y-p.by)*12+(M-p.bm)-(p.bd&&D<p.bd?1:0);
  return tm<24?`${tm} oylik`:`${Math.floor(tm/12)} yosh`;
}
const birthText=p=>!p.by?'19__ (kiritilmagan)':p.bm?`${p.by}-yil ${p.bd}-${OY[p.bm-1]}`:`${p.by}-yil`;
const modal=document.getElementById('modal'),mc=document.getElementById('mc');
function open(id){
  const p=P[id],nm=i=>P[i].n;
  const rows=[['Tugʻilgan',birthText(p)],['Yoshi',ageText(p)]];
  if(p.par)rows.push(['Ota-onasi',p.par.map(nm).join(' va ')]);
  if(p.sp)rows.push(['Juftligi',nm(p.sp)]);
  if(p.kids)rows.push(['Farzandlari',p.kids.join(', ')]);
  mc.innerHTML=`<div class="text-center ${p.g} ${p.dead?'dead':''}">
    <span class="ibox ${p.g}">${ICO(p.g,64)}</span>
    <h3 class="disp text-2xl font-bold mt-3">${p.n}</h3>
    <p class="text-sm" style="color:var(--mute)">${p.dead?'† Hayot emas':'Hayot'}</p></div>
    <div class="my-4 rounded-xl p-3 text-center" style="background:rgba(184,137,59,.14);border:1px solid var(--gold)">
      <div class="text-xs uppercase tracking-widest" style="color:var(--mute)">Menga kim boʻladi</div>
      <div class="disp text-lg font-bold">${p.rel}</div></div>
    ${rows.map(r=>`<div class="row"><span>${r[0]}</span><span>${r[1]}</span></div>`).join('')}${gcal(p)}`;
  modal.classList.replace('hidden','flex');
}
const close=()=>modal.classList.replace('flex','hidden');
document.getElementById('app').addEventListener('click',e=>{const b=e.target.closest('.card');if(b)open(b.dataset.id)});
modal.addEventListener('click',e=>{if(e.target===modal)close()});
document.getElementById('x').onclick=close;
addEventListener('keydown',e=>{if(e.key==='Escape')close()});

/* Tugʻilgan kunlar → kalendar */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
function nextBirthday(p){const y=now.getFullYear();let d=new Date(y,p.bm-1,p.bd);if(d<new Date(y,now.getMonth(),now.getDate()))d=new Date(y+1,p.bm-1,p.bd);return d}
const hasBd=p=>!p.dead&&p.bm&&p.bd;
function gurl(p){const d=nextBirthday(p),e=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent('🎂 '+p.n+' tugʻilgan kuni')+'&dates='+ymd(d)+'/'+ymd(e)+'&recur='+encodeURIComponent('RRULE:FREQ=YEARLY')+'&details='+encodeURIComponent(p.rel+' (Oilaviy shajara)')}
function gcal(p){return hasBd(p)?`<a href="${gurl(p)}" target="_blank" rel="noopener" class="block text-center mt-4 rounded-full py-2" style="background:var(--gold);color:#fff">📅 Google Kalendarga qoʻshish</a>`:''}
function makeICS(){
  const esc=t=>t.replace(/[,;]/g,'\\$&'),L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Oilaviy Shajara//UZ//','CALSCALE:GREGORIAN','X-WR-CALNAME:Oilaviy tugʻilgan kunlar'];
  Object.values(P).filter(hasBd).forEach(p=>{const d=nextBirthday(p),e=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);
    L.push('BEGIN:VEVENT','UID:bday-'+p.id+'@shajara','DTSTAMP:'+ymd(now)+'T000000Z','DTSTART;VALUE=DATE:'+ymd(d),'DTEND;VALUE=DATE:'+ymd(e),'RRULE:FREQ=YEARLY','SUMMARY:🎂 '+esc(p.n)+' tugʻilgan kuni','DESCRIPTION:'+esc(p.rel),'TRANSP:TRANSPARENT',
      'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Ertaga '+esc(p.n)+' tugʻilgan kuni','TRIGGER:-PT15H','END:VALARM',
      'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Bugun '+esc(p.n)+' tugʻilgan kuni','TRIGGER:PT9H','END:VALARM','END:VEVENT')});
  L.push('END:VCALENDAR');return L.join('\r\n');
}
function dlICS(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([makeICS()],{type:'text/calendar;charset=utf-8'}));a.download='tugilgan-kunlar.ics';document.body.appendChild(a);a.click();a.remove()}
function bdayList(){
  const ps=Object.values(P).filter(hasBd).sort((a,b)=>nextBirthday(a)-nextBirthday(b));
  mc.innerHTML=`<h3 class="disp text-xl font-bold text-center">🎂 Tugʻilgan kunlar</h3>
   <p class="text-sm text-center mb-2" style="color:var(--mute)">Eng yaqinidan boshlab. Har yili takrorlanadi — 📅 ni bossangiz Google Kalendarga qoʻshiladi.</p>
   <div style="max-height:48vh;overflow:auto">${ps.map(p=>`<div class="row"><span>${p.n}</span><span>${p.bd}-${OY[p.bm-1]} <a href="${gurl(p)}" target="_blank" rel="noopener">📅</a></span></div>`).join('')}</div>
   <button id="ics2" class="block w-full text-center mt-4 rounded-full py-2" style="background:var(--gold);color:#fff">⬇ Hammasini .ics fayl qilib yuklash</button>`;
  modal.classList.replace('hidden','flex');document.getElementById('ics2').onclick=dlICS;
}
document.getElementById('bd').onclick=bdayList;

/* Kattalashtirish */
let z=innerWidth<700?.7:1;const zoom=d=>{z=Math.min(1.4,Math.max(.6,z+d));document.querySelectorAll('.tree-scroll').forEach(e=>e.style.zoom=z)};
document.getElementById('zi').onclick=()=>zoom(.1);document.getElementById('zo').onclick=()=>zoom(-.1);
/* Oilalarni birlashtirish: bitta shajara */
const forest=document.getElementById('forest'),mainEl=document.getElementById('main'),svg=document.getElementById('links');
const pos=el=>{let x=0,y=0;while(el&&el!==forest){x+=el.offsetLeft;y+=el.offsetTop;el=el.offsetParent}return{x,y}};
const find=(id,sc)=>forest.querySelector(`${sc} [data-id="${id}"]`);
function layout(){
  mainEl.style.marginLeft='0px';
  const o1=find('mamurjon','.roots'),o2=find('soraxon','.roots'),cp=mainEl.querySelector('.couple');
  const mid=(pos(o1).x+o1.offsetWidth/2+pos(o2).x+o2.offsetWidth/2)/2;
  mainEl.style.marginLeft=Math.max(0,mid-(pos(cp).x+cp.offsetWidth/2))+'px';
  svg.setAttribute('width',forest.offsetWidth);svg.setAttribute('height',forest.offsetHeight);
  let d='';
  ['mamurjon','soraxon','muslima'].forEach(id=>{
    const a=find(id,'.roots'),b=find(id,'.main'),pa=pos(a),pb=pos(b);
    const x1=pa.x+a.offsetWidth/2,y1=pa.y+a.offsetHeight,x2=pb.x+b.offsetWidth/2,y2=pb.y,m=(y2-y1)/2;
    d+=`<path d="M${x1} ${y1}C${x1} ${y1+m},${x2} ${y2-m},${x2} ${y2}"/><circle cx="${x1}" cy="${y1}" r="4.5"/><circle cx="${x2}" cy="${y2}" r="4.5"/>`;
  });
  svg.innerHTML=d;
}
document.querySelectorAll('.tree-scroll').forEach(e=>e.style.zoom=z);
const centre=()=>document.querySelectorAll('.tree-scroll').forEach(e=>e.scrollLeft=(e.scrollWidth-e.clientWidth)/2);
layout();centre();
addEventListener('load',()=>{layout();centre()});
addEventListener('resize',layout);
if(document.fonts)document.fonts.ready.then(layout);
if(window.ResizeObserver){const ro=new ResizeObserver(layout);ro.observe(document.querySelector('.roots'));ro.observe(mainEl)}
setTimeout(layout,600);

// Xotiralar galereyasi — suratlar shu brauzerda saqlanadi.
const memoryFiles = document.getElementById('memoryFiles');
const memoryCaption = document.getElementById('memoryCaption');
const memoryGrid = document.getElementById('memoryGrid');
const MEMORY_KEY = 'oilaviy-shajara-xotiralar-v1';
let memories = [];
try { memories = JSON.parse(localStorage.getItem(MEMORY_KEY) || '[]'); } catch(e) {}
function escapeMemoryText(v) {
  return String(v).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function renderMemories() {
  memoryGrid.innerHTML = memories.length ? memories.map((m,i) => `
    <article class="memory-card">
      <img src="${m.src}" alt="Oilaviy xotira" loading="lazy">
      <div class="memory-caption">${escapeMemoryText(m.caption || 'Oilaviy xotira')}</div>
      <div class="memory-actions"><span class="text-xs" style="color:var(--mute)">${m.date}</span>
      <button type="button" data-delete-memory="${i}">O‘chirish</button></div>
    </article>`).join('') :
    '<div class="memory-empty" style="grid-column:1/-1">Hozircha xotiralar yo‘q. Birinchi oilaviy suratingizni joylang 🌿</div>';
}
function saveMemories() {
  try { localStorage.setItem(MEMORY_KEY, JSON.stringify(memories)); return true; }
  catch(e) { alert('Brauzer xotirasi to‘ldi. Kichikroq rasmlarni tanlang yoki ayrimlarini o‘chiring.'); return false; }
}
memoryFiles.addEventListener('change', async () => {
  const files = Array.from(memoryFiles.files || []).filter(f => f.type.startsWith('image/'));
  const caption = memoryCaption.value.trim();
  for (const file of files) {
    try {
      const data = await new Promise((resolve,reject) => {
        const r = new FileReader(); r.onload = () => resolve(r.result); r.onerror = reject; r.readAsDataURL(file);
      });
      const small = await new Promise(resolve => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, 1200 / Math.max(img.width,img.height));
          const c = document.createElement('canvas'); c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
          c.getContext('2d').drawImage(img,0,0,c.width,c.height); resolve(c.toDataURL('image/jpeg',0.8));
        };
        img.onerror = () => resolve(data); img.src = data;
      });
      memories.unshift({src:small,caption,date:new Date().toLocaleDateString('uz-UZ')});
    } catch(e) { alert('Rasmni o‘qishda xatolik yuz berdi.'); }
  }
  if (saveMemories()) renderMemories();
  memoryFiles.value = '';
});
memoryGrid.addEventListener('click', e => {
  const b = e.target.closest('[data-delete-memory]');
  if (b && confirm('Bu rasmni xotiralardan o‘chirasizmi?')) {
    memories.splice(Number(b.dataset.deleteMemory),1);
    if (saveMemories()) renderMemories();
  }
});
renderMemories();

</script>
</body>
</html>
